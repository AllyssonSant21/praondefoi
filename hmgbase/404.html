<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · Pra Onde Foi?</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="marca/favicon.png">
<style>
  :root{color-scheme:light dark;--bg:#f5f6f8;--card:#fff;--text:#1f1d1e;--muted:#67645d;--accent:#fed13d;--q:#e0a922;--line:#e3e5e9}
  @media (prefers-color-scheme:dark){:root{--bg:#151619;--card:#1e2024;--text:#f1f0ee;--muted:#a5a29b;--line:#2e3035}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--text);
       font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  main{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:32px 28px;text-align:left}
  .marca{display:flex;align-items:center;gap:12px;margin-bottom:28px}
  .marca img{width:48px;height:48px;border-radius:11px;display:block}
  .marca b{font-size:18px;line-height:1.05}
  .marca b span{color:var(--q)}
  .cod{font-size:64px;font-weight:800;line-height:1;margin:0;letter-spacing:-.02em;color:var(--text)}
  .cod span{color:var(--q)}
  h1{font-size:22px;margin:14px 0 8px}
  p{margin:0;color:var(--muted);font-size:15px;line-height:1.5}
  a.btn{display:inline-flex;align-items:center;justify-content:center;margin-top:24px;min-height:48px;padding:0 22px;border-radius:4px;
        background:var(--accent);color:#1f1d1e;font-weight:700;font-size:15px;text-decoration:none}
  a.btn:focus-visible{outline:3px solid var(--text);outline-offset:2px}
</style>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<main>
  <div class="marca"><img src="marca/logo-simbolo.svg" alt="Logo do Pra Onde Foi?"><b>Pra onde<br>foi<span>?</span></b></div>
  <p class="cod">404<span>?</span></p>
  <h1>Essa página não existe</h1>
  <p>O endereço pode ter sido digitado errado ou a página mudou de lugar. Seus dados continuam guardados no app.</p>
  <a class="btn" href="/">Ir para o Pra Onde Foi?</a>
</main>
</body>
</html>
